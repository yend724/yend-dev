name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Check ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [v1, v2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm --filter @yend.dev/${{ matrix.package }} lint

      - name: Run build
        run: pnpm --filter @yend.dev/${{ matrix.package }} build

      - name: Run v2 typecheck
        if: matrix.package == 'v2'
        run: pnpm --filter @yend.dev/v2 typecheck
